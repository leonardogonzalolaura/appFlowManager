[package]
name = "flowmanager"
version = "0.1.1"
description = "FlowManager - orquestador de requerimientos y despliegues"
authors = ["Leonardo Gonzalo Laura"]
edition = "2021"

[lib]
name = "flowmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.18.3"
regex = "1"
uuid = { version = "1", features = ["v7"] }
calamine = "0.24"
csv = "1.3"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["time", "macros", "rt", "net", "io-util"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-postgres = "0.7"
postgres-native-tls = "0.5"
native-tls = "0.2"

[dev-dependencies]
tempfile = "3"
