name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize migrations to LF
        shell: pwsh
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          Get-ChildItem src-tauri/migrations/*.sql | ForEach-Object {
            $text = [System.IO.File]::ReadAllText($_.FullName).Replace("`r`n", "`n")
            [System.IO.File]::WriteAllText($_.FullName, $text, $utf8)
          }
          $crlf = @()
          Get-ChildItem src-tauri/migrations/*.sql | ForEach-Object {
            if ([System.IO.File]::ReadAllText($_.FullName).Contains([char]13)) {
              $crlf += $_.Name
            }
          }
          if ($crlf.Count -gt 0) {
            throw "Migraciones con CRLF: $($crlf -join ', ')"
          }
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install frontend dependencies
        run: npm ci
      - name: Build and upload installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'launcherapp v__VERSION__'
          releaseBody: 'Instaladores de Windows (NSIS .exe y MSI).'
